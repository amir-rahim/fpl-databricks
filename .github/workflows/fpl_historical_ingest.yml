name: FPL Historical Backfill

on:
  workflow_dispatch: {}   # run this manually whenever you add a season to SEASONS
  schedule:
    # Monthly is plenty -- the source dataset itself only updates ~3x/season
    - cron: '0 6 1 * *'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run historical backfill
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python scripts/fpl_historical_backfill.py